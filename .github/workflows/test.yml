name: Windows TCP diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - name: Compare UDP buffers and relay transport
        env:
          TAILCAT_TCP_TRACE: "1"
        run: |
          failed=0
          for experiment in default:false 8192:false 65536:false 524288:false default:true; do
            IFS=: read -r TAILCAT_TEST_UDP_BUFFER TAILCAT_TEST_RELAY_ONLY <<< "$experiment"
            export TAILCAT_TEST_UDP_BUFFER TAILCAT_TEST_RELAY_ONLY
            for test in closed_tcp_retains_received_data_until_application_reads native_transfer_preserves_half_close_and_discovers_direct_path; do
              echo "::group::buffer=$TAILCAT_TEST_UDP_BUFFER relay_only=$TAILCAT_TEST_RELAY_ONLY test=$test"
              if cargo test --locked --all-features --lib "$test" -- --nocapture; then
                echo "EXPERIMENT PASSED"
              else
                failed=1
                echo "EXPERIMENT FAILED"
              fi
              echo "::endgroup::"
            done
          done
          exit "$failed"
