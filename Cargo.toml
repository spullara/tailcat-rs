[package]
name = "tailcat"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Control-plane-free TCP over WireGuard and DERP"
license = "BSD-3-Clause"
repository = "https://github.com/spullara/tailcat-rs"
default-run = "tailcat"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
rcgen = "0.14"
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false }
bytes = "1"
cap-std = "4"
cap-fs-ext = "4"
chrono = "0.4"
ciborium = "0.2"
crypto_box = { version = "0.9", features = ["salsa20", "getrandom"] }
dirs = "6"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hickory-resolver = "0.26"
hmac = "0.12"
libc = "0.2"
portable-pty = "0.9"
rand = "0.8"
rand10 = { package = "rand", version = "0.10" }
if-addrs = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = "0.63.1"
russh-sftp = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp", "async"] }
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
tokio-util = { version = "0.7", features = ["rt", "compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
